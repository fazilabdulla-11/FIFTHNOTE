<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - FIFTH NOTE</title>
</head>

<body>

    <h1>Create Account</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">SIGN UP</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'myapp:login' %}">Login here</a>
    </p>

</body>
</html>
