<!DOCTYPE html>
<html>
<head>
    <title>Login - FIFTH NOTE</title>
</head>

<body>

    <h1>Login</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">LOGIN</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'myapp:signup' %}">Sign Up</a>
    </p>

</body>
</html>
