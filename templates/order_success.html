{% extends 'base.html' %}

{% block title %}
Order Confirmed — FIFTH NOTE
{% endblock %}

{% block content %}

<style>
    .success-page {
        max-width: 700px;
        margin: 100px auto;
        padding: 40px 20px;
        text-align: center;
    }

    .success-icon {
        font-size: 60px;
        margin-bottom: 20px;
    }

    .success-page h1 {
        font-size: 38px;
        letter-spacing: 3px;
        margin-bottom: 20px;
    }

    .success-page p {
        color: #666;
        font-size: 17px;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    .home-button {
        display: inline-block;
        background: #111;
        color: white;
        padding: 15px 35px;
        text-decoration: none;
        letter-spacing: 1px;
    }

    .home-button:hover {
        background: #333;
    }
</style>

<div class="success-page">

    <div class="success-icon">
        ✓
    </div>

    <h1>ORDER CONFIRMED</h1>

    <p>
        Thank you for your order.<br>
        Your perfume order has been successfully placed.
    </p>

    <a href="{% url 'myapp:home' %}" class="home-button">
        CONTINUE SHOPPING
    </a>

</div>

{% endblock %}
